services:
  app:
    profiles: [app]
    build:
      context: .
      target: final
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ALLOW_LOOPBACK_HTTP: ${OIDC_ALLOW_LOOPBACK_HTTP:-false}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    cap_drop: [ALL]

  migrate:
    profiles: [app]
    build:
      context: .
      target: migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - veranstaltung_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [oidc]
    command: [start-dev, --import-realm, --hostname=http://127.0.0.1:8080]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/veranstaltung-realm.json:/opt/keycloak/data/import/veranstaltung-realm.json:ro
      - veranstaltung_keycloak_data:/opt/keycloak/data

volumes:
  veranstaltung_postgres_data:
  veranstaltung_keycloak_data:
